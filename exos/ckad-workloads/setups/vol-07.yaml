apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: broken-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
  storageClassName: missing-class
---
apiVersion: v1
kind: Pod
metadata:
  name: data-writer
  labels:
    app: writer
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: broken-data
