apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.crd04.ckad.io
  labels:
    ckad.training/exercise: crd-04
spec:
  group: crd04.ckad.io
  scope: Namespaced
  names:
    kind: Widget
    plural: widgets
    singular: widget
    shortNames: ["wd"]
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["size", "color"]
              properties:
                size:
                  type: integer
                  minimum: 1
                  maximum: 10
                color:
                  type: string
                  enum: ["red", "green", "blue"]
