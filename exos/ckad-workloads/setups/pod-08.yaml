apiVersion: v1
kind: Pod
metadata:
  name: ops-reporter
spec:
  containers:
    - name: reporter
      image: busybox:1.36
      command: ["sh", "-c", "echo CKAD-OPS-READY; sleep 3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: obsolete-pod
spec:
  containers:
    - name: obsolete
      image: busybox:1.36
      command: ["sleep", "3600"]
