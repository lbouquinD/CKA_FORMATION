apiVersion: v1
kind: Namespace
metadata:
  name: ckad-np-03-clients
  labels:
    role: clients
    ckad.training/exercise: np-03
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: nginx
          image: nginx:1.27.3
          ports:
            - containerPort: 80
