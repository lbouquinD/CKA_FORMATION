apiVersion: apps/v1
kind: Deployment
metadata:
  name: named-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: named-web
  template:
    metadata:
      labels:
        app: named-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27.3
          ports:
            - name: web
              containerPort: 80
