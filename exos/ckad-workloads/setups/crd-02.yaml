apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: heroes.crd02.ckad.io
  labels:
    ckad.training/exercise: crd-02
spec:
  group: crd02.ckad.io
  scope: Namespaced
  names:
    kind: Hero
    plural: heroes
    singular: hero
    shortNames: ["hr"]
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["universe", "powerLevel"]
              properties:
                universe:
                  type: string
                specialPower:
                  type: string
                powerLevel:
                  type: integer
                  minimum: 0
                  maximum: 10000
