apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reporter
  template:
    metadata:
      labels:
        app: reporter
    spec:
      containers:
        - name: reporter
          image: busybox:1.36
          command: ["sleep", "3600"]
