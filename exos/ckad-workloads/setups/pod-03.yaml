apiVersion: v1
kind: Pod
metadata:
  name: web-dev
  labels:
    tier: ui
    stage: test
  annotations:
    builder: ansible
spec:
  containers:
    - name: web-dev
      image: nginx:alpine
      env:
        - name: APP_ENV
          value: development
---
apiVersion: v1
kind: Pod
metadata:
  name: api-dev
  labels:
    tier: backend
spec:
  containers:
    - name: api-dev
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
