apiVersion: v1
kind: ServiceAccount
metadata:
  name: metrics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: metrics-reader
rules:
  - apiGroups: ["apps"]
    resources: ["pod", "services"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metrics-reader
subjects:
  - kind: ServiceAccount
    name: metrics
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: metrics-reader
---
apiVersion: v1
kind: Pod
metadata:
  name: metrics-agent
  labels:
    app: metrics
spec:
  serviceAccountName: metrics
  containers:
    - name: agent
      image: busybox:1.36
      command: ["sleep", "3600"]
